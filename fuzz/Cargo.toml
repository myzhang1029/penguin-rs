[package]
name = "rusty-penguin-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

bytes = { workspace = true }
rusty-penguin = { path = "../penguin" }
penguin-mux = { path = "../penguin-mux", features = ["tungstenite"] }
rcgen = { workspace = true, features = ["crypto", "pem"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite = { workspace = true, default-features = false }

[[bin]]
name = "frame-parser"
path = "fuzz_targets/frame_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "socket-input"
path = "fuzz_targets/socket_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote-parser"
path = "fuzz_targets/remote_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http-server-input"
path = "fuzz_targets/http_server_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http-server-input-tls"
path = "fuzz_targets/http_server_input_tls.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
