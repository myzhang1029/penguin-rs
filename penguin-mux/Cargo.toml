[package]
name = "penguin-mux"
version = "0.8.4"
authors = ["Zhang Maiyun <me@maiyun.me>"]
edition = "2024"
description = "TCP/UDP multiplexing over HTTP WebSocket"
readme = "README.md"
repository = "https://github.com/myzhang1029/penguin-rs"
license = "Apache-2.0 OR GPL-3.0-or-later"
keywords = ["web", "websocket"]
categories = ["asynchronous", "network-programming", "web-programming::websocket", "web-programming::http-server"]

[[bench]]
name = "stream_throughput"
harness = false
required-features = ["tungstenite"]

[lib]
name = "penguin_mux"
path = "src/lib.rs"

[dependencies]
bytes = { workspace = true }
cow-bytes = { path = "../cow-bytes", default-features = false }
derive_more = { workspace = true, features = ["debug", "deref", "from", "into"] }
futures-util = { workspace = true, features = ["async-await-macro", "async-await"] }
hashbrown = { version = "0.17", features = ["default-hasher"], default-features = false }
nohash-hasher = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
pin-project-lite = "0.2"
rand = { workspace = true }
spin = { version = "0.12", features = ["use_ticket_mutex", "rwlock", "lock_api"], default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "sync"] }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }
yawc = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
divan = "0.1"
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["server", "tokio"] }
penguin-mux = { path = ".", default-features = false, features = ["__dev-dependencies"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["checkpoint", "futures"] }

[features]
default = ["std", "tokio", "tungstenite"]
std = ["dep:parking_lot", "rand/thread_rng", "tokio/parking_lot"]
# Expect the tokio runtime to be available
tokio = ["tokio-rt", "tokio-io-util", "tokio-time"]
tokio-rt = ["tokio/rt"]
tokio-io-util = ["tokio/io-util"]
tokio-time = ["tokio/time"]
# Support `tungstenite` WebSocket implementation
tungstenite = ["dep:tokio-tungstenite"]
# Support `yawc` WebSocket implementation
yawc = ["dep:yawc"]
# Use nohash-hasher for flow_id hashmaps
nohash = ["dep:nohash-hasher"]
# Facility to launch `parking_lot`'s deadlock detection in a separate thread in tests
deadlock-detection = ["std", "parking_lot/deadlock_detection"]

__dev-dependencies = ["tokio-rt", "tokio/macros", "tokio/net", "tokio/rt-multi-thread"]

[lints]
workspace = true
